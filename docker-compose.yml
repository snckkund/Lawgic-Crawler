version: '3.8'

services:
  lawgic:
    build: .
    ports:
      - "5050:5050"
    env_file:
      - .env
    volumes:
      - ./lawgic.db:/app/lawgic.db
      - ./bns_laws.csv:/app/bns_laws.csv
      - ./raw_bns.txt:/app/raw_bns.txt
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/"]
      interval: 30s
      timeout: 10s
      retries: 3
